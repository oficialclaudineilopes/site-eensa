<!DOCTYPE html>
<html lang="pt-BR">
<!-- 
  ARQUIVO: impressao.html 
  LOCAL: Portal do Professor (Página de acesso ao sistema de impressão via iframe)
  MODIFICADO EM: 15 de Novembro de 2026, às 20:22
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Impressão - EENSA</title>

  <style>
    :root {
      --verde: #183d38;
      --creme: #f5f3ec;
      --branco: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--creme);
      /* Remove a barra de rolagem externa da página principal, deixando só a do sistema */
      overflow: hidden; 
    }

    /* Cabeçalho minimalista para o professor saber onde está */
    header {
      background: var(--branco);
      padding: 15px 20px;
      border-bottom: 1px solid #e1e1d8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px; /* Altura fixa do cabeçalho */
    }

    .voltar-btn {
      color: var(--verde);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .voltar-btn:hover {
      text-decoration: underline;
    }

    /* Configuração do Iframe para ocupar o resto da tela perfeitamente */
    .iframe-container {
      width: 100%;
      height: calc(100vh - 60px); /* 100% da tela MENOS os 60px do cabeçalho */
      background: var(--creme);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <strong style="color: var(--verde);">EENSA - Sistema de Impressões</strong>
    <a href="mestres.html" class="voltar-btn">← Voltar ao Portal</a>
  </header>

  <div class="iframe-container">
    <!-- COLOQUE AQUI O SEU LINK DO GOOGLE SCRIPT -->
    <iframe src="https://script.google.com/a/macros/escola.pr.gov.br/s/AKfycbx9VPIOQfV0J-OSbPC2b18N2Jaj9krz55jKjt9R95FaE30Qv60t6qBVFXAj6cCNEGOd/exec" title="Sistema de Impressão"></iframe>
  </div>

</body>
</html>
